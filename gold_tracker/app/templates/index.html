<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldTracker Pro | Live FinTech Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --glass: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --gold: #FFD700;
            --gold-glow: rgba(255, 215, 0, 0.3);
            --bg: #020617;
            --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 0% 0%, #1e293b 0%, #020617 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .dashboard {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        /* Modern Card Design */
        .card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 32px;
            box-shadow: var(--card-shadow);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: 0.3;
        }

        .full-width { grid-column: 1 / -1; }

        /* Typography & Price Display */
        .header-box h1 { 
            margin: 0; font-size: 1.1rem; text-transform: uppercase; 
            letter-spacing: 2px; opacity: 0.6; display: flex; align-items: center; gap: 8px; 
        }

        .price-container { display: flex; align-items: center; gap: 20px; margin: 15px 0; }
        
        .header-box h2 { 
            margin: 0; font-size: 4.2rem; font-weight: 800; color: #fff;
            text-shadow: 0 0 30px var(--gold-glow);
        }

        /* Live Indicator Pulse */
        .live-pulse {
            width: 10px; height: 10px; background: #4ade80;
            border-radius: 50%; display: inline-block;
            box-shadow: 0 0 0 rgba(74, 222, 128, 0.4);
            animation: pulse 2s infinite;
            margin-right: 8px;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(74, 222, 128, 0); }
            100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
        }

        /* Inputs and Buttons */
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.85rem; opacity: 0.6; }

        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); opacity: 0.4; }

        input {
            width: 100%; padding: 16px 16px 16px 48px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            border-radius: 16px; color: white; font-size: 1rem;
        }

        input:focus { outline: none; border-color: var(--gold); background: rgba(255,255,255,0.07); }

        button {
            width: 100%; padding: 18px; background: var(--gold);
            color: #000; border: none; border-radius: 18px;
            font-weight: 800; font-size: 1rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 12px;
        }

        button:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 12px 24px rgba(255, 215, 0, 0.3);
            background: #fff;
        }

        /* Chart height */
        .chart-box { height: 400px; }

        @media (max-width: 768px) {
            .dashboard { grid-template-columns: 1fr; }
            .header-box h2 { font-size: 2.8rem; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="card full-width header-box">
            <h1><i data-lucide="shield-check" size="18"></i> Secure Market Feed</h1>
            <div class="price-container">
                <h2 id="currentPrice">₹ --,---</h2>
                <div>
                    <span style="background: rgba(74,222,128,0.1); color: #4ade80; padding: 6px 14px; border-radius: 100px; font-size: 0.8rem; font-weight: 700; border: 1px solid rgba(74,222,128,0.2);">
                        <span class="live-pulse"></span> LIVE
                    </span>
                </div>
            </div>
            <p style="opacity: 0.5; margin: 0; font-weight: 500; font-size: 0.9rem;">24K Pure Gold • 10 Grams • INR Market</p>
        </div>

        <div class="card full-width chart-box">
            <canvas id="goldChart"></canvas>
        </div>

        <div class="card">
            <h3 style="margin-top:0"><i data-lucide="bell" style="color: var(--gold)"></i> Smart Alerts</h3>
            
            <div class="input-group">
                <label>WhatsApp Number</label>
                <div class="input-wrapper">
                    <i data-lucide="phone" size="18"></i>
                    <input type="text" id="phone" placeholder="+91 00000 00000">
                </div>
            </div>
            
            <div class="input-group">
                <label>Target Price (INR)</label>
                <div class="input-wrapper">
                    <i data-lucide="trending-down" size="18"></i>
                    <input type="number" id="target" placeholder="Enter amount">
                </div>
            </div>
            
            <button onclick="setAlert()">
                Enable Tracking <i data-lucide="chevron-right"></i>
            </button>
            <p id="alertStatus" style="margin-top:15px; font-size:0.8rem; text-align:center"></p>
        </div>

        <div class="card">
            <h3 style="margin-top:0"><i data-lucide="zap" style="color: var(--gold)"></i> Analysis</h3>
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <div style="display: flex; justify-content: space-between; border-bottom: 1px solid var(--glass-border); padding-bottom: 8px;">
                    <span style="opacity: 0.6">Local Taxes</span>
                    <span style="color: #4ade80">+12% Applied</span>
                </div>
                <div style="display: flex; justify-content: space-between; border-bottom: 1px solid var(--glass-border); padding-bottom: 8px;">
                    <span style="opacity: 0.6">Refresh Rate</span>
                    <span>30 Seconds</span>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span style="opacity: 0.6">Alert System</span>
                    <span>Twilio Cloud</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let goldChart;

        async function fetchPrice() {
            try {
                const response = await fetch('/api/price');
                const data = await response.json();
                
                if(data.current_price > 0) {
                    const priceEl = document.getElementById('currentPrice');
                    priceEl.innerText = `₹ ${data.current_price.toLocaleString('en-IN')}`;
                    updateChart(data.history);
                }
            } catch (error) { console.error("API Fetch Error:", error); }
        }

        function updateChart(history) {
            // --- THE TIMEZONE FIX ---
            const labels = history.map(h => {
                const date = new Date(h.time); // Browser sees 'Z' and converts to IST
                return date.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
            });
            
            const prices = history.map(h => h.price);

            if (!goldChart) {
                const ctx = document.getElementById('goldChart').getContext('2d');
                const gradient = ctx.createLinearGradient(0, 0, 0, 400);
                gradient.addColorStop(0, 'rgba(255, 215, 0, 0.25)');
                gradient.addColorStop(1, 'rgba(255, 215, 0, 0)');

                goldChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: prices,
                            borderColor: '#FFD700',
                            backgroundColor: gradient,
                            borderWidth: 4,
                            fill: true,
                            tension: 0.45,
                            pointRadius: 0,
                            pointHoverRadius: 6,
                            pointHoverBackgroundColor: '#fff',
                            pointHoverBorderColor: '#FFD700'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { intersect: false, mode: 'index' },
                        scales: {
                            x: { grid: { display: false }, ticks: { color: 'rgba(255,255,255,0.4)', font: { family: 'Plus Jakarta Sans' } } },
                            y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: 'rgba(255,255,255,0.4)' } }
                        },
                        plugins: { legend: { display: false } }
                    }
                });
            } else {
                goldChart.data.labels = labels;
                goldChart.data.datasets[0].data = prices;
                goldChart.update('none');
            }
        }

        async function setAlert() {
            // Logic remains same as previous, handles POST to /api/subscribe
            const phone = document.getElementById('phone').value;
            const target = document.getElementById('target').value;
            const status = document.getElementById('alertStatus');
            
            try {
                const res = await fetch('/api/subscribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, target })
                });
                const data = await res.json();
                status.innerText = data.message;
                status.style.color = "#4ade80";
            } catch (e) { status.innerText = "Error setting alert."; }
        }

        fetchPrice();
        setInterval(fetchPrice, 30000);
    </script>
</body>
</html>
